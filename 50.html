:root{

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{padding-block:22px 60px}
h2{font-size:22px;font-weight:700;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}

.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pv{overflow:hidden;background:#8c8a84;padding:0}
.pv-sizer{position:relative}
.pv-inner{width:794px;transform-origin:top right;position:absolute;top:0;right:0}
.pvcol{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow-y:auto;overscroll-behavior:contain}
.mview{display:none;gap:6px;margin-bottom:14px}
.cl{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.cl .hd{display:flex;gap:8px;align-items:center}
.cl .hd input[type=text]{font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{border-top:1px solid var(--line);padding:9px 8px;text-align:right;vertical-align:middle}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
#toast{position:fixed;inset:auto 0 calc(20px + env(safe-area-inset-bottom,0px)) 0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#toast span{background:var(--ink);color:var(--surface);padding:9px 16px;font-size:14px;opacity:0;transition:opacity .2s}
#toast.on span{opacity:1}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.scroll-x{overflow-x:auto}
@media (max-width:960px){

  .pvcol{position:static;max-height:none;overflow:visible}

  .tabs{margin-inline-start:0;width:100%;overflow-x:auto;flex-wrap:nowrap}

@media print{

  main,.wrap,.shell,.pvcol,.pv,.pv-sizer,.pv-inner{

  @page{size:A4;margin:0}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const money = n => '₪ ' + Math.round(n).toLocaleString('en-US');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dmy = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; };
const weeksText = n => n === 1 ? 'לשבוע' : n === 2 ? 'לשבועיים' : 'ל-' + n + ' שבועות';
const tplOf = id => TEMPLATES.find(t => t.id === id) || TEMPLATES[TEMPLATES.length - 1];

function fillText(t, P, d) {
  const adv = d && d.advance != null ? d.advance : P.advance;
  return String(t)
    .replace(/\{advance\}/g, adv).replace(/\{sketches\}/g, P.sketches).replace(/\{rounds\}/g, P.rounds)
    .replace(/\{hourly\}/g, P.hourly).replace(/\{cancel\}/g, P.cancel).replace(/\{validity\}/g, weeksText(P.validity));
}

function calc(d, S) {
  const lines = [];
  let sub = 0;
  S.services.forEach(s => {
    const sel = d.sel[s.id];
    if (!sel || !sel.on) return;
    const price = sel.price != null && sel.price !== '' ? num(sel.price) : s.price;
    const qty = s.qty ? Math.max(1, num(sel.qty || 1)) : 1;
    const total = price * qty;
    lines.push({ name: s.name, desc: s.desc, qty: s.qty ? qty : 1, unit: price, total, bonus: !!s.bonus });
    if (!s.bonus) sub += total;
  });
  (d.custom || []).forEach(c => {
    if (!c.name && !num(c.price)) return;
    const p = num(c.price);
    lines.push({ name: c.name || 'שירות נוסף', desc: '', qty: 1, unit: p, total: p, bonus: false });
    sub += p;
  });
  const discount = Math.min(sub, Math.max(0, num(d.discount)));
  const net = sub - discount;
  const vat = d.vat ? net * (S.params.vatRate / 100) : 0;
  const total = net + vat;
  const advPct = d.advance != null ? num(d.advance) : S.params.advance;
  const advance = Math.round(total * advPct / 100);
  return { lines, sub, discount, vat, total, advPct, advance, balance: total - advance };
}

function tierData(d, S) {
  const set = TIERSETS.find(x => x.id === d.tierSet) || TIERSETS[0];
  const tiers = set.tiers.map(t => {
    const lines = [];
    let total = 0;
    t[1].forEach(ref => {
      const p = ref.split(':'), s = S.services.find(x => x.id === p[0]); if (!s) return;
      const q = p[1] ? +p[1] : 1, tt = s.price * q;
      lines.push({ name: s.name + (q > 1 ? ' × ' + q : ''), desc: s.desc, total: tt }); total += tt;
    });
    return { name: t[0], rec: !!t[2], lines, total };
  });
  return { set, tiers };
}

function lineAmt(l) {
  return l.bonus ? '<span>מתנה!</span><small>בשווי ' + money(l.total) + '</small>'
    : money(l.total) + (l.qty > 1 ? '<small>' + l.qty + ' × ' + money(l.unit) + '</small>' : '');
}

function quoteBody(d, S, c) {
  const st = d.style || 'list';
  if (st === 'tiers') {
    const td = tierData(d, S);
    return '<div class="d-tiers">' + td.tiers.map(t => '<div class="d-tier' + (t.rec ? ' rec' : '') + '">' + (t.rec ? '<div class="rb">מומלץ</div>' : '') +
      '<div class="tn">' + esc(t.name) + '</div><ul>' + t.lines.map(l => '<li>' + esc(l.name) + '</li>').join('') + '</ul>' +
      '<div class="tp">' + money(t.total) + '</div></div>').join('') + '</div>' +
      '<div class="d-note">בוחרים אפשרות אחת ומאשרים בחתימה. אפשר לשלב ולהתאים כל אפשרות לצורך.</div>';
  }
  if (!c.lines.length) return '<div class="d-note">עוד לא נבחרו שירותים.</div>';
  if (st === 'table') {
    return '<table class="d-tbl"><thead><tr><th>שלב העבודה</th><th>תיאור השירות</th><th>עלות</th></tr></thead><tbody>' +
      c.lines.map(l => '<tr class="' + (l.bonus ? 'gift' : '') + '"><td class="n">' + (l.bonus ? 'בונוס מתנה! ' : '') + esc(l.name) + '</td><td>' + esc(l.desc).replace(/\n/g, '<br>') +
        '</td><td class="a">' + lineAmt(l) + '</td></tr>').join('') + '</tbody></table>';
  }
  if (st === 'inclusive') {
    return '<ul class="d-inc">' + c.lines.map(l => '<li><b>' + esc(l.name) + (l.qty > 1 ? ' × ' + l.qty : '') + '</b>' +
      (l.desc ? '<ul>' + l.desc.split('\n').map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</li>').join('') + '</ul>';
  }
  return c.lines.map(l => '<div class="d-row' + (l.bonus ? ' d-gift' : '') + '"><div><div class="d-nm">' + (l.bonus ? 'בונוס מתנה! ' : '') + esc(l.name) + '</div>' +
    (l.desc ? '<div class="d-ds">' + esc(l.desc) + '</div>' : '') + '</div><div class="d-amt">' + lineAmt(l) + '</div></div>').join('');
}

  const c = calc(d, S), T = tplOf(d.tpl), L = [];

  L.push('בסיעתא דשמיא', name + (d.project || T.title ? ' – ' + (d.project || T.title) : ''));
  if (d.client) L.push('לכבוד: ' + d.client);
  if (d.date) L.push('תאריך: ' + dmy(d.date));
  if (d.type !== 'contract' && d.style === 'tiers') {
    L.push('');
    tierData(d, S).tiers.forEach(t => L.push('• ' + t.name + (t.rec ? ' (מומלץ)' : '') + ': ' + t.lines.map(l => l.name).join(', ') + ' – ' + money(t.total)));
    if (d.deadline) L.push('דד ליין: ' + d.deadline);
  } else if (d.type !== 'contract') {
    L.push('');
    c.lines.forEach(l => L.push('• ' + l.name + (l.qty > 1 ? ' (' + l.qty + ' × ' + money(l.unit) + ')' : '') + ' – ' + (l.bonus ? 'מתנה (בשווי ' + money(l.total) + ')' : money(l.total))));
    if (c.discount) L.push('הנחה: -' + money(c.discount));
    if (c.vat) L.push('מע"מ: ' + money(c.vat));
    L.push('סה"כ לתשלום: ' + money(c.total));
    if (c.advPct > 0 && c.total > 0) L.push('מקדמה (' + c.advPct + '%): ' + money(c.advance) + ' | יתרה: ' + money(c.balance));
    if (d.deadline) L.push('דד ליין: ' + d.deadline);
  }
  if (d.type !== 'quote') {
    L.push('', 'תנאי העבודה:');
    S.clauses.forEach(cl => { if ((d.off || []).indexOf(cl.id) < 0) L.push('• ' + (cl.title ? cl.title + ': ' : '') + fillText(cl.text, S.params, d)); });
  }
  L.push('', S.studio.hebName + ' | ' + S.studio.phone);
  if (S.studio.bank && d.type !== 'contract') L.push('פרטי הבנק: ' + S.studio.bank);
  return L.join('\n');
}

function triggerBlobDownload(filename, blobOrStr, mime) {
  const blob = blobOrStr instanceof Blob ? blobOrStr : new Blob([blobOrStr], { type: mime || 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  setTimeout(() => {

}

/* יצירת קובץ PDF אחד ארוך הרציף לכל המסמך */
async function renderLongSinglePdfBlob() {
  const host = document.createElement('div');
  host.id = 'pdfHost';
  host.style.cssText = 'position:fixed;left:0;top:0;width:794px;opacity:0;pointer-events:none;z-index:-1';
  host.innerHTML = docHtml(D, S);
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 80));
    const paper = host.firstElementChild;
    const W = 794;
    const totalPx = Math.max(1123, paper.offsetHeight);
    const SC = 2;

    const cv = await html2canvas(paper, {
      scale: SC,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false,
      width: W,
      height: totalPx,
      windowWidth: W,
      onclone: doc => {
        const h = doc.getElementById('pdfHost');
        if (h) h.style.opacity = '1';
      }
    });

    const pdfWidthPt = 595.28;
    const pdfHeightPt = (totalPx / W) * pdfWidthPt;
    const pdf = new window.jspdf.jsPDF({
      unit: 'pt',
      format: [pdfWidthPt, pdfHeightPt],
      orientation: 'portrait'
    });

    pdf.addImage(cv.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, pdfWidthPt, pdfHeightPt);
    return pdf.output('blob');
  } finally {
    host.remove();
  }
}

async function downloadLongPdf() {
  const btn = $('#pdfBtn');
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'מכין PDF ארוך…'; }
  setStatus('מכין קובץ PDF רציף אחד…');
  try {
    if (window.html2canvas && window.jspdf) {
      const blob = await renderLongSinglePdfBlob();
      triggerBlobDownload(docFileSlug() + '.pdf', blob, 'application/pdf');
      setStatus('קובץ ה-PDF הארוך ירד למחשב');
      toast('קובץ ה-PDF הארוך הורד בהצלחה');
    } else {
      setStatus('ספריית ה-PDF לא נטענה – פותח חלון הדפסה');
      window.print();
    }
  } catch (e) {
    setStatus('שגיאה ביצירת ה-PDF – נפתח חלון הדפסה');
    toast('פותח חלון הדפסה');
    window.print();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = old || 'הורדה כ-PDF'; }
  }
}

async function saveDoc() {
  if (!D.client) { toast('כדאי להזין שם לקוח לפני שמירה'); $('#f_client').focus(); return; }
  if (!D.id) D.id = 'c_' + Date.now().toString(36);
  await Store.save({ id: D.id, saved: Date.now(), d: clone(D) });
  persistDraft(); toast('נשמר ברשימת הלקוחות');
}

function pvBarHtml() {
  return '<button class="btn pri" id="pdfBtn" type="button">הורדה כ-PDF</button>' +
         '<button class="btn" id="cpBtn" type="button">העתקת טקסט (וואטסאפ / מייל)</button>';
}

function buildDocTab() {
  $('#form').innerHTML = formHtml();
  $('#svcBox').innerHTML = svcHtml();
  $('#customBox').innerHTML = customHtml();
  $('#clBox').innerHTML = clauseListHtml();
  $('#pvbar').innerHTML = pvBarHtml();
  $('#sumBox').innerHTML = sumHtml();
  $('#clBox').parentElement.style.display = D.type === 'quote' ? 'none' : '';
  renderPreview();
}

function showTab(name) {
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $$('.tab').forEach(t => { t.hidden = t.id !== 'tab-' + name; });
  if (name === 'doc') { buildDocTab(); }
  if (name === 'saved') renderSaved();
  if (name === 'prices') renderPrices();
  if (name === 'terms') renderTerms();
  if (name === 'studio') renderStudio();
  window.scrollTo(0, 0);
}

function arm(btn, label, fn) {
  if (btn.dataset.arm) { fn(); return; }
  btn.dataset.arm = '1'; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.arm; btn.textContent = old; } }, 3000);
}
const setBool = (c, v) => c.setAttribute('aria-pressed', String(v));

$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
$('#mview').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  $('#shell').classList.toggle('show-pv', b.dataset.v === 'view');
  $$('#mview button').forEach(x => x.classList.toggle('pri', x === b));
  if (b.dataset.v === 'view') setTimeout(fitPreview, 30);
});

const form = $('#form');
form.addEventListener('click', e => {
  const t = e.target;
  const ty = t.closest('#typeSeg button');
  if (ty) {
    D.type = ty.dataset.type; $$('#typeSeg button').forEach(b => setBool(b, b === ty));
    $('#clBox').parentElement.style.display = D.type === 'quote' ? 'none' : ''; refreshSum(); return;
  }
  const catBtn = t.closest('#catSeg button');
  if (catBtn) {
    const val = catBtn.dataset.cat;
    D.category = val;
    const inp = $('#f_category');
    if (inp) inp.value = val;
    $$('#catSeg button').forEach(b => setBool(b, b === catBtn));
    refreshSum(); return;
  }
  const sty = t.closest('#styleSeg button');
  if (sty) {
    D.style = sty.dataset.style; $$('#styleSeg button').forEach(b => setBool(b, b === sty));
    $('#tierPick').hidden = D.style !== 'tiers'; $('#svcCard').hidden = D.style === 'tiers'; refreshSum(); return;
  }
  const tr = t.closest('#tierSeg button');
  if (tr) { D.tierSet = tr.dataset.tier; $$('#tierSeg button').forEach(b => setBool(b, b === tr)); refreshSum(); return; }
  const tp = t.closest('#tplSeg button');
  if (tp) { applyTemplate(tp.dataset.tpl); buildDocTab(); persistDraft(); return; }
  if (t.closest('#addCustom')) { D.custom.push({ name: '', price: 0 }); $('#customBox').innerHTML = customHtml(); refreshSum(); return; }
  const cx = t.closest('.cx');
  if (cx) { D.custom.splice(+cx.closest('[data-i]').dataset.i, 1); $('#customBox').innerHTML = customHtml(); refreshSum(); return; }
  if (t.closest('#saveBtn')) { saveDoc(); return; }
  if (t.closest('#newBtn')) { D = newDraft(D.tpl); buildDocTab(); persistDraft(); toast('מסמך חדש'); }
});

form.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k) {
    const k = t.dataset.k;
    D[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'category') {
      $$('#catSeg button').forEach(b => setBool(b, b.dataset.cat === D.category));
    }
    refreshSum(); return;
  }
  if (t.dataset.cl) {
    const off = new Set(D.off || []);
    if (t.checked) off.delete(t.dataset.cl); else off.add(t.dataset.cl);
    D.off = Array.from(off); refreshSum(); return;
  }
  const row = t.closest('.svc');
  if (row) {
    const id = row.dataset.id; const sel = D.sel[id] || (D.sel[id] = { on: false });
    if (t.classList.contains('on')) { sel.on = t.checked; row.classList.toggle('off', !t.checked); }
    else if (t.classList.contains('q')) sel.qty = t.value;
    else if (t.classList.contains('p')) sel.price = t.value;
    refreshSum(); return;
  }
  const cr = t.closest('#customBox [data-i]');
  if (cr) {
    const c = D.custom[+cr.dataset.i];
    if (t.classList.contains('cn')) c.name = t.value; else if (t.classList.contains('cp')) c.price = t.value;
    refreshSum();
  }
});

$('#pvbar').addEventListener('click', e => {
  if (e.target.closest('#pdfBtn')) downloadLongPdf();
  if (e.target.closest('#cpBtn')) copyText(docText(D, S));
});

$('#tab-saved').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const list = $('#savedList')._list || [], rec = list.find(r => r.id === tr.dataset.id);
  if (e.target.closest('.op') && rec) { D = clone(rec.d); D.id = rec.id; showTab('doc'); persistDraft(); }
  const rm = e.target.closest('.rm');
  if (rm) arm(rm, 'לאישור המחיקה', async () => { await Store.remove(tr.dataset.id); toast('נמחק'); renderSaved(); });
});

const prices = $('#tab-prices');
function onPriceInput(e) {
  const t = e.target, card = t.closest('.card[data-id]'); if (!card || !t.dataset.f) return;
  const s = S.services.find(x => x.id === card.dataset.id); if (!s) return;
  const f = t.dataset.f;
  s[f] = (f === 'qty' || f === 'bonus') ? t.checked : f === 'price' ? num(t.value) : t.value;
  queueSettingsSave();
}
prices.addEventListener('input', e => {
  if (e.target.id === 'svcSearch') {
    const q = e.target.value.trim().toLowerCase();
    $$('#tab-prices .card[data-id]').forEach(c => { const s = S.services.find(x => x.id === c.dataset.id); c.hidden = !!q && !((s.name + ' ' + s.cat + ' ' + s.desc).toLowerCase().includes(q)); });
    return;
  }
  onPriceInput(e);
});
prices.addEventListener('click', e => {
  const t = e.target;
  const rm = t.closest('.rm');
  if (rm) arm(rm, 'לאישור המחיקה', () => { S.services = S.services.filter(x => x.id !== rm.closest('.card').dataset.id); queueSettingsSave(); renderPrices(); });
  if (t.closest('#addSvc')) { S.services.push({ id: 'u' + Date.now().toString(36), cat: 'כללי', name: 'שירות חדש', price: 0, qty: false, bonus: false, desc: '' }); queueSettingsSave(); renderPrices(); window.scrollTo(0, document.body.scrollHeight); }
  const rs = t.closest('#resetSvc');
  if (rs) arm(rs, 'לאישור האיפוס', () => { S.services = clone(DEFAULTS.services); queueSettingsSave(); renderPrices(); toast('המחירון חזר להגדרות המקור'); });
});

const terms = $('#tab-terms');
terms.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.p) { S.params[t.dataset.p] = num(t.value); queueSettingsSave(); return; }
  const card = t.closest('.cl[data-i]');
  if (card && t.dataset.c) { S.clauses[+card.dataset.i][t.dataset.c] = t.value; queueSettingsSave(); }
});
terms.addEventListener('click', e => {
  const t = e.target, card = t.closest('.cl[data-i]'), i = card ? +card.dataset.i : -1;
  const swap = j => { if (j < 0 || j >= S.clauses.length) return; const x = S.clauses[i]; S.clauses[i] = S.clauses[j]; S.clauses[j] = x; queueSettingsSave(); renderTerms(); };
  if (t.closest('.up')) swap(i - 1);
  if (t.closest('.dn')) swap(i + 1);
  const rm = t.closest('.rm');
  if (rm) arm(rm, 'לאישור המחיקה', () => { S.clauses.splice(i, 1); queueSettingsSave(); renderTerms(); });
  if (t.closest('#addCl')) { S.clauses.push({ id: 'u' + Date.now().toString(36), title: '', text: '' }); queueSettingsSave(); renderTerms(); window.scrollTo(0, document.body.scrollHeight); }
  const rs = t.closest('#resetCl');
  if (rs) arm(rs, 'לאישור האיפוס', () => { S.clauses = clone(DEFAULTS.clauses); S.params = clone(DEFAULTS.params); queueSettingsSave(); renderTerms(); toast('התקנון חזר לנוסח המקור'); });
});

$('#tab-studio').addEventListener('input', e => {
  const k = e.target.dataset.s;
  if (k) { S.studio[k] = e.target.value; queueSettingsSave(); }
});

if (window.ResizeObserver) new ResizeObserver(fitPreview).observe($('#pv'));
window.addEventListener('resize', fitPreview);

(function start() {
  const saved = lsGet('pf_settings');
  if (saved) {
    S = Object.assign(clone(DEFAULTS), saved);
    S.studio = Object.assign({}, DEFAULTS.studio, saved.studio || {});
    S.params = Object.assign({}, DEFAULTS.params, saved.params || {});
  }
  D = lsGet('pf_draft') || newDraft('brand1');
  if (!D.sel || !D.custom || !D.off) D = newDraft('brand1');
  if (D.category == null) D.category = tplOf(D.tpl).noun;
  showTab('doc');
})();
</script>
</body>
</html>
